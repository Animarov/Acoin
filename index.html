<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 70px;
        }

        .welcome-screen {
            text-align: center;
            padding: 50px 20px;
        }

        .welcome-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-in;
        }

        .main-screen {
            display: none;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .balance {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
            color: #feca57;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
        }

        .btn-bet {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-bet.active {
            background: linear-gradient(45deg, #feca57, #ff9ff3);
            border-color: #feca57;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 10px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .game-screen {
            display: none;
            text-align: center;
        }

        .history {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 10px;
            margin: 20px 0;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        .history-number {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .game-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .game-option {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .game-option:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .game-option.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .dice {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .timer {
            font-size: 18px;
            margin: 10px 0;
            color: #feca57;
            display: none;
        }

        .bet-section {
            margin: 20px 0;
        }

        .bet-amounts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .bet-type {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .bet-input-section {
            margin: 20px 0;
        }

        .bet-input {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
            text-align: center;
        }

        .bet-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .current-bet {
            background: rgba(254, 202, 87, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px solid #feca57;
        }

        .bet-info {
            margin: 10px 0;
            font-size: 14px;
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes roll {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .rolling {
            animation: roll 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-text" id="welcomeText"></div>
        </div>

        <!-- Main Screen -->
        <div class="main-screen" id="mainScreen">
            <div class="profile-card">
                <div class="avatar" id="userAvatar">👤</div>
                <div class="profile-info">
                    <div>Профиль: <span id="userId"></span></div>
                    <div class="balance" id="userBalance">100 Монет</div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="deposit()">Пополнить</button>
                <button class="btn btn-primary" onclick="withdraw()">Вывести</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div class="game-screen" id="gameScreen">
            <div class="history" id="diceHistory"></div>
            
            <div class="timer" id="timer">Время на ставку: 15с</div>
            
            <div class="bet-section" id="betSection">
                <h3>Выберите тип ставки:</h3>
                
                <div class="bet-type">
                    <button class="btn btn-bet" onclick="selectBetType('1-3')">1-3</button>
                    <button class="btn btn-bet" onclick="selectBetType('4-6')">4-6</button>
                </div>
                
                <div class="bet-type">
                    <button class="btn btn-bet" onclick="selectBetType('even')">Чёт</button>
                    <button class="btn btn-bet" onclick="selectBetType('odd')">Нечёт</button>
                </div>

                <div class="bet-info" id="betInfo">
                    Выберите тип ставки
                </div>

                <div class="current-bet" id="currentBetInfo" style="display: none;">
                    <strong>Текущая ставка:</strong>
                    <div id="currentBetText"></div>
                </div>

                <div class="bet-input-section">
                    <h4>Сумма ставки:</h4>
                    <div class="bet-amounts">
                        <button class="btn btn-bet" onclick="setBetAmount(100)">+100</button>
                        <button class="btn btn-bet" onclick="setBetAmount(500)">+500</button>
                        <button class="btn btn-bet" onclick="setBetAmount(1000)">+1к</button>
                        <button class="btn btn-bet" onclick="setBetAmount(10000)">+10к</button>
                    </div>
                    
                    <input type="number" class="bet-input" id="betAmount" placeholder="Введите ставку" min="1">
                    <button class="btn btn-primary" onclick="placeBet()" id="placeBetBtn">Подтвердить ставку</button>
                </div>
            </div>

            <div class="game-options">
                <div class="game-option" onclick="rollDice()">
                    <div class="dice">🎲</div>
                    <div>Бросить кубик</div>
                </div>
                <div class="game-option disabled">
                    <div class="dice">🚧</div>
                    <div>В разработке..</div>
                </div>
            </div>

            <div id="diceResult"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-btn" onclick="showProfile()">Профиль</button>
        <button class="nav-btn" onclick="showGame()">Играть</button>
        <button class="nav-btn" onclick="showMore()">Ещё</button>
    </div>

    <script>
        class TelegramGame {
            constructor() {
                this.tg = window.Telegram.WebApp;
                this.user = null;
                this.balance = 100;
                this.diceHistory = [];
                this.currentBet = {
                    amount: 0,
                    type: null,
                    multiplier: 1
                };
                this.timer = null;
                this.timeLeft = 15;
                this.isTimerActive = false;
                
                this.betMultipliers = {
                    '1-3': 2,    // Ставка на 1-3 (x2)
                    '4-6': 2,    // Ставка на 4-6 (x2)
                    'even': 2,   // Ставка на чёт (x2)
                    'odd': 2     // Ставка на нечёт (x2)
                };
                
                this.init();
            }

            init() {
                this.tg.expand();
                this.tg.enableClosingConfirmation();
                
                this.user = this.tg.initDataUnsafe.user;
                this.loadUserData();
                this.showWelcome();
                
                setTimeout(() => {
                    this.showMainScreen();
                }, 5000);
            }

            async loadUserData() {
                try {
                    const savedData = this.getFromStorage();
                    if (savedData) {
                        this.balance = savedData.balance || 100;
                        this.diceHistory = savedData.diceHistory || [];
                    }
                    this.updateUI();
                } catch (error) {
                    console.error('Ошибка загрузки данных:', error);
                }
            }

            async saveUserData() {
                try {
                    this.saveToStorage({
                        userId: this.user?.id,
                        balance: this.balance,
                        diceHistory: this.diceHistory
                    });
                } catch (error) {
                    console.error('Ошибка сохранения данных:', error);
                }
            }

            getFromStorage() {
                try {
                    return JSON.parse(localStorage.getItem('telegramGameData') || '{}');
                } catch {
                    return null;
                }
            }

            saveToStorage(data) {
                try {
                    localStorage.setItem('telegramGameData', JSON.stringify(data));
                } catch (error) {
                    console.error('Ошибка сохранения в localStorage:', error);
                }
            }

            showWelcome() {
                const welcomeText = document.getElementById('welcomeText');
                if (this.user) {
                    welcomeText.textContent = `Привет, ${this.user.first_name || 'Друг'}!`;
                } else {
                    welcomeText.textContent = 'Привет, Друг!';
                }
            }

            showMainScreen() {
                document.getElementById('welcomeScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'block';
                document.getElementById('gameScreen').style.display = 'none';
                this.updateUI();
            }

            showGame() {
                document.getElementById('welcomeScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'none';
                document.getElementById('gameScreen').style.display = 'block';
                this.resetBet();
                this.updateDiceHistory();
            }

            showProfile() {
                this.showMainScreen();
            }

            showMore() {
                this.tg.showAlert('Раздел "Ещё" в разработке');
            }

            updateUI() {
                if (this.user) {
                    document.getElementById('userId').textContent = this.user.id;
                    if (this.user.first_name) {
                        document.getElementById('userAvatar').textContent = this.user.first_name[0].toUpperCase();
                    }
                }
                document.getElementById('userBalance').textContent = `${this.balance} Монет`;
            }

            deposit() {
                this.tg.openTelegramLink('https://t.me/animarovs');
            }

            withdraw() {
                this.tg.openTelegramLink('https://t.me/animarovs');
            }

            selectBetType(type) {
                // Сброс активных кнопок
                document.querySelectorAll('.btn-bet').forEach(btn => {
                    btn.classList.remove('active');
                });
                
                // Активация выбранной кнопки
                event.target.classList.add('active');
                
                this.currentBet.type = type;
                this.currentBet.multiplier = this.betMultipliers[type];
                
                const betInfo = {
                    '1-3': 'Ставка на числа 1, 2, 3 (выигрыш x2)',
                    '4-6': 'Ставка на числа 4, 5, 6 (выигрыш x2)',
                    'even': 'Ставка на чётные числа (x2)',
                    'odd': 'Ставка на нечётные числа (x2)'
                };
                
                document.getElementById('betInfo').textContent = betInfo[type];
                this.updateCurrentBetDisplay();
            }

            setBetAmount(amount) {
                const input = document.getElementById('betAmount');
                input.value = amount;
                this.updateCurrentBetDisplay();
            }

            updateCurrentBetDisplay() {
                const currentBetInfo = document.getElementById('currentBetInfo');
                const currentBetText = document.getElementById('currentBetText');
                
                if (this.currentBet.type && document.getElementById('betAmount').value) {
                    const amount = parseInt(document.getElementById('betAmount').value);
                    const betTypeText = {
                        '1-3': '1-3',
                        '4-6': '4-6',
                        'even': 'Чёт',
                        'odd': 'Нечёт'
                    }[this.currentBet.type];
                    
                    currentBetText.textContent = `${amount} монет на ${betTypeText} (x${this.currentBet.multiplier})`;
                    currentBetInfo.style.display = 'block';
                } else {
                    currentBetInfo.style.display = 'none';
                }
            }

            placeBet() {
                const betAmount = parseInt(document.getElementById('betAmount').value);
                
                if (!this.currentBet.type) {
                    this.tg.showAlert('Выберите тип ставки!');
                    return;
                }
                
                if (!betAmount || betAmount < 1) {
                    this.tg.showAlert('Введите корректную сумму ставки');
                    return;
                }
                
                if (betAmount > this.balance) {
                    this.tg.showAlert('Недостаточно монет');
                    return;
                }
                
                this.currentBet.amount = betAmount;
                document.getElementById('placeBetBtn').textContent = 'Ставка принята!';
                document.getElementById('placeBetBtn').style.background = '#4cd964';
                
                // Запуск таймера только после принятия ставки
                this.startBetTimer();
                
                this.tg.showAlert(`Ставка ${betAmount} монет принята!`);
            }

            startBetTimer() {
                if (this.isTimerActive) return;
                
                this.isTimerActive = true;
                this.timeLeft = 15;
                document.getElementById('timer').style.display = 'block';
                this.updateTimer();
                
                if (this.timer) {
                    clearInterval(this.timer);
                }
                
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    this.updateTimer();
                    
                    if (this.timeLeft <= 0) {
                        clearInterval(this.timer);
                        this.isTimerActive = false;
                        this.autoRollDice();
                    }
                }, 1000);
            }

            updateTimer() {
                const timerElement = document.getElementById('timer');
                timerElement.textContent = `Время на ставку: ${this.timeLeft}с`;
                
                if (this.timeLeft <= 5) {
                    timerElement.style.color = '#ff6b6b';
                } else {
                    timerElement.style.color = '#feca57';
                }
            }

            rollDice() {
                if (this.currentBet.amount === 0) {
                    this.tg.showAlert('Сначала сделайте ставку!');
                    return;
                }

                if (!this.isTimerActive) {
                    this.tg.showAlert('Время на ставку истекло! Сделайте новую ставку.');
                    return;
                }

                this.performDiceRoll();
            }

            autoRollDice() {
                if (this.currentBet.amount === 0) {
                    // Если ставка не сделана, сбрасываем
                    this.resetBet();
                    return;
                }
                this.performDiceRoll();
            }

            performDiceRoll() {
                const diceElement = document.querySelector('.dice');
                const resultElement = document.getElementById('diceResult');
                
                diceElement.classList.add('rolling');
                
                setTimeout(() => {
                    diceElement.classList.remove('rolling');
                    
                    const diceResult = Math.floor(Math.random() * 6) + 1;
                    
                    // Добавление в историю
                    this.diceHistory.push(diceResult);
                    if (this.diceHistory.length > 10) {
                        this.diceHistory.shift();
                    }
                    
                    // Расчет выигрыша
                    this.calculatePayout(diceResult);
                    
                    // Показать результат
                    resultElement.innerHTML = `
                        <div style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px;">
                            <h3>🎲 Выпало: ${diceResult}</h3>
                            <p>Ставка: ${this.currentBet.amount} монет</p>
                            <p>Тип: ${this.getBetTypeText()}</p>
                        </div>
                    `;
                    
                    // Обновление UI
                    this.updateDiceHistory();
                    this.updateUI();
                    this.saveUserData();
                    
                    // Сброс ставки и таймера
                    this.resetBet();
                    
                }, 500);
            }

            getBetTypeText() {
                return {
                    '1-3': '1-3',
                    '4-6': '4-6',
                    'even': 'Чёт',
                    'odd': 'Нечёт'
                }[this.currentBet.type];
            }

            calculatePayout(diceResult) {
                let isWin = false;
                
                switch (this.currentBet.type) {
                    case '1-3':
                        isWin = diceResult >= 1 && diceResult <= 3;
                        break;
                    case '4-6':
                        isWin = diceResult >= 4 && diceResult <= 6;
                        break;
                    case 'even':
                        isWin = diceResult % 2 === 0;
                        break;
                    case 'odd':
                        isWin = diceResult % 2 === 1;
                        break;
                }
                
                if (isWin) {
                    const winAmount = this.currentBet.amount * this.currentBet.multiplier;
                    this.balance += winAmount;
                    this.tg.showAlert(`🎉 Поздравляем! Вы выиграли ${winAmount} монет!`);
                } else {
                    this.balance -= this.currentBet.amount;
                    this.tg.showAlert(`😔 К сожалению, вы проиграли ${this.currentBet.amount} монет.`);
                }
            }

            resetBet() {
                this.currentBet = { amount: 0, type: null, multiplier: 1 };
                document.getElementById('betAmount').value = '';
                document.getElementById('placeBetBtn').textContent = 'Подтвердить ставку';
                document.getElementById('placeBetBtn').style.background = '';
                document.getElementById('currentBetInfo').style.display = 'none';
                document.getElementById('timer').style.display = 'none';
                document.getElementById('betInfo').textContent = 'Выберите тип ставки';
                
                // Сброс активных кнопок
                document.querySelectorAll('.btn-bet').forEach(btn => {
                    btn.classList.remove('active');
                });
                
                if (this.timer) {
                    clearInterval(this.timer);
                    this.isTimerActive = false;
                }
            }

            updateDiceHistory() {
                const historyElement = document.getElementById('diceHistory');
                historyElement.innerHTML = this.diceHistory.map(num => 
                    `<div class="history-number">${num}</div>`
                ).join('');
            }
        }

        let game;

        document.addEventListener('DOMContentLoaded', () => {
            game = new TelegramGame();
        });

        // Обновление отображения при вводе суммы
        document.getElementById('betAmount').addEventListener('input', function() {
            game.updateCurrentBetDisplay();
        });

        function showProfile() { game.showProfile(); }
        function showGame() { game.showGame(); }
        function showMore() { game.showMore(); }
        function deposit() { game.deposit(); }
        function withdraw() { game.withdraw(); }
        function rollDice() { game.rollDice(); }
        function placeBet() { game.placeBet(); }
        function selectBetType(type) { game.selectBetType(type); }
        function setBetAmount(amount) { game.setBetAmount(amount); }
    </script>
</body>
</html>
